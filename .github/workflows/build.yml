# Builds PRoot with the NDK, the rootfs on a native arm64 runner, then the APK (PRoot inside, rootfs NOT inside).
# Tagged builds (v*) publish the APK and the rootfs files to GitHub Release; the app downloads
# the rootfs from there only when the user presses the install button (same as EZlator imagefs).
# NDK로 PRoot를, arm64 실행기에서 rootfs를 만들고 APK를 빌드함(PRoot는 APK 안, rootfs는 APK 밖).
# 태그(v*) 빌드는 APK와 rootfs 파일을 GitHub Release에 올림. 앱은 사용자가 설치 버튼을
# 누를 때만 거기서 rootfs를 받음(EZlator imagefs와 같은 방식)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Needed to create a Release with the default token
# 기본 토큰으로 Release를 만들려면 필요함
permissions:
  contents: write

jobs:
  proot:
    # NDK is preinstalled on GitHub's Ubuntu runner (ANDROID_NDK_LATEST_HOME)
    # GitHub Ubuntu 실행기에는 NDK가 설치되어 있음(ANDROID_NDK_LATEST_HOME)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuse the last build while the build script (which pins the sources) is unchanged
      # 빌드 스크립트(소스 고정 포함)가 그대로면 지난 빌드 결과를 재사용함
      - id: cache
        uses: actions/cache@v4
        with:
          key: proot-${{ hashFiles('tools/build-proot-android.sh') }}
          path: |
            out/jni/
            runtime/src/main/assets/proot-source.txt

      # libproot.so + libproot-loader.so + proot-source.txt (pinned termux/proot commit)
      # PRoot 본체, 로더, 소스 기록(termux/proot 고정 커밋)
      - name: proot
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/build-proot-android.sh out/jni

      - uses: actions/upload-artifact@v4
        with:
          name: proot
          path: |
            out/jni/
            runtime/src/main/assets/proot-source.txt
          retention-days: 14

  turnip:
    # Mesa Turnip for glibc aarch64 (KGSL + X11), built in the same Debian release as the rootfs
    # rootfs와 같은 Debian 릴리스에서 glibc aarch64용 Mesa Turnip(KGSL + X11) 빌드
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Reuse the last driver package while the build script (Mesa version, options) is unchanged.
      # A rebuild takes minutes; a cache hit takes seconds.
      # 빌드 스크립트(Mesa 버전, 옵션)가 그대로면 지난 드라이버 묶음을 재사용함.
      # 다시 빌드하면 수 분, 캐시를 쓰면 수 초
      - id: cache
        uses: actions/cache@v4
        with:
          key: turnip-${{ hashFiles('tools/build-turnip-glibc.sh') }}
          path: out-turnip/

      # Mesa source is fetched on the runner host (retries, mirrors, sha256), then built in the container
      # Mesa 소스는 실행기 본체에서 받고(재시도, 미러, sha256) 컨테이너에서 빌드함
      - name: mesa source
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/build-turnip-glibc.sh fetch src-mesa/mesa.tar.xz

      - name: turnip
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD:/src" -w /src debian:trixie sh tools/build-turnip-glibc.sh build out-turnip src-mesa/mesa.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: turnip
          path: out-turnip/
          retention-days: 14

  rootfs:
    # Native arm64: no emulation for gcc, tests or docker
    # arm64 기본 실행기: gcc·시험·docker 모두 에뮬레이션 없음
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The preload library is no longer used at run time (PRoot does the path work);
      # it is still built and self-tested on aarch64 so the code stays usable for later work
      # preload 라이브러리는 실행에 더 이상 쓰지 않음(경로 처리는 PRoot가 함).
      # 나중 작업에 쓸 수 있게 aarch64에서 빌드·자체 시험만 유지함
      - name: libezglibc
        run: |
          make -C native/ezglibc
          make -C native/ezglibc test
          objdump -T native/ezglibc/libezglibc.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1

      # Reuse the last rootfs while its build scripts are unchanged. The helper scripts in
      # rootfs-overlay are not part of the key: the app copies them from the APK before each run.
      # A reused rootfs keeps its version string, so the app does not download it again.
      # rootfs 빌드 스크립트가 그대로면 지난 rootfs를 재사용함. rootfs-overlay 보조 스크립트는
      # 앱이 실행 전에 APK에서 복사하므로 키에 넣지 않음. 재사용하면 버전 문자열이 그대로라
      # 앱이 다시 받지 않음
      - id: cache
        uses: actions/cache@v4
        with:
          key: rootfs-${{ hashFiles('tools/build-rootfs.sh', 'tools/fix-abs-symlinks.sh') }}
          path: out/

      # rootfs.tar.xz + .sha256 + rootfs.version + rootfs.packages.txt
      # rootfs 압축 파일, 체크섬, 버전, 패키지 목록 생성
      - name: rootfs
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/build-rootfs.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: out/
          retention-days: 7

  apk:
    needs: [proot, rootfs, turnip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PRoot into the runtime module's jniLibs (packaged into the APK)
      # PRoot를 런타임 모듈 jniLibs에 넣음(APK에 들어감)
      - uses: actions/download-artifact@v4
        with:
          name: proot
          path: proot-artifact
      - name: place proot
        run: |
          mkdir -p runtime/src/main/jniLibs/arm64-v8a runtime/src/main/assets
          cp proot-artifact/out/jni/*.so runtime/src/main/jniLibs/arm64-v8a/
          cp proot-artifact/runtime/src/main/assets/proot-source.txt runtime/src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same Gradle as Android Studio: the wrapper (gradle/wrapper/gradle-wrapper.properties)
      # Android Studio와 같은 Gradle: wrapper 사용
      - uses: gradle/actions/setup-gradle@v4

      # Fixed debug signing key from the repository secret DEBUG_KEYSTORE_B64 (the developer's
      # Android Studio debug.keystore, base64). Without it each CI run makes a new random key and
      # the next APK cannot be installed over the previous one. Skipped when the secret is unset.
      # 저장소 비밀값 DEBUG_KEYSTORE_B64(개발자 Android Studio debug.keystore의 base64)로 고정 디버그 서명.
      # 없으면 CI가 매번 새 키를 만들어 다음 APK를 덮어 설치할 수 없음. 비밀값이 없으면 건너뜀
      - name: debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/ezs-debug.keystore"
            printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KS"
            # Must open with the standard debug key values, else stop here
            # 기본 디버그 키 값으로 열려야 함. 아니면 여기서 멈춤
            keytool -list -keystore "$KS" -storepass android -alias androiddebugkey > /dev/null
            # Certificate SHA-256 of the key (lowercase hex, no colons) for the check after the build
            # 빌드 후 대조용 키 인증서 SHA-256(소문자 16진수, 콜론 없음)
            KEY_SHA=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey \
                      | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
            echo "EZS_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "EZS_KEY_SHA=$KEY_SHA" >> "$GITHUB_ENV"
            echo "fixed debug keystore ready, certificate ${KEY_SHA:0:12}"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 not set: each build gets a new debug key (no update installs)"
          fi

      # The app reads the rootfs from this repository's latest Release
      # 앱은 이 저장소의 최신 Release에서 rootfs를 받음
      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon \
            "-Pezsteam.rootfsBaseUrl=https://github.com/${{ github.repository }}/releases/latest/download/" \
            "-Pezsteam.gitSha=${GITHUB_SHA::7}" \
            ${EZS_DEBUG_KEYSTORE:+"-Pezsteam.debugKeystore=$EZS_DEBUG_KEYSTORE"}
          # The APK must carry the fixed key's certificate, otherwise fail the build
          # APK 서명 인증서가 고정 키와 같아야 함. 다르면 빌드를 실패로 처리
          if [ -n "${EZS_KEY_SHA:-}" ]; then
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
            APK_SHA=$("$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
                      | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
            echo "apk certificate ${APK_SHA:0:12}, fixed key ${EZS_KEY_SHA:0:12}"
            [ "$APK_SHA" = "$EZS_KEY_SHA" ] || { echo "::error::APK is not signed with the fixed debug key"; exit 1; }
          fi
          # Build id next to the APK (read by tools/ezs.ps1 to know whether the APK is current)
          # APK 옆의 빌드 번호(tools/ezs.ps1이 APK가 최신인지 확인할 때 읽음)
          echo "${GITHUB_SHA::7}" > app/build/outputs/apk/debug/apk.version

      # Every main-branch build replaces the APK of the fixed pre-release "apk-latest", so the
      # install script always downloads from the same address. Pre-releases are not "latest",
      # so the rootfs/driver address (releases/latest) is unaffected.
      # main 빌드마다 고정 사전 출시 "apk-latest"의 APK를 바꿔 올림. 설치 스크립트는 항상 같은 주소에서 받음.
      # 사전 출시는 "latest"가 아니므로 rootfs·드라이버 주소(releases/latest)에는 영향 없음
      - name: apk-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: apk-latest (main 최신 시험 APK)
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: "main ${{ github.sha }}"
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apk.version

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Release files: rootfs from the first job (kept outside the APK)
      # Release용 파일: 첫 작업이 만든 rootfs(APK 밖에 둠)
      - name: rootfs files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: out

      # Driver package from the turnip job (downloaded by the app's [드라이버 설치])
      # turnip 작업이 만든 드라이버 묶음(앱의 [드라이버 설치]가 받음)
      - name: turnip files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: turnip
          path: out-turnip

      # Tagged builds go to GitHub Releases (not marked prerelease, so releases/latest finds them)
      # 태그 빌드는 GitHub Releases에 올림(사전 출시로 두지 않아야 releases/latest가 찾음)
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            out/rootfs.tar.xz
            out/rootfs.tar.xz.sha256
            out/rootfs.version
            out/rootfs.packages.txt
            out-turnip/turnip.tar.xz
            out-turnip/turnip.tar.xz.sha256
            out-turnip/turnip.version
