<!-- System bus for the Steam session inside the rootfs: only the app's own programs are on it
     (NetworkManager stand-in ezs-netstate.py, the Steam client), so everything is allowed.
     Started by steam-run.sh. Own file, MIT.
     rootfs 안 Steam 세션용 시스템 버스: 앱 자체 프로그램만 붙음(NetworkManager 대역 ezs-netstate.py, Steam
     클라이언트)이라 모두 허용함. steam-run.sh가 띄움. 자체 파일, MIT -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
